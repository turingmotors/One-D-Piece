experiment:
    project: "exp001-titok_generation"
    name: "exp001-titok_s128_llamagen"
    output_dir: "/home/user_00005_821839/workspace/One-D-Piece-Experiment/experiments/llamagen_s128_titok_run1"
    max_train_examples: 1_281_167
    save_every: 10_000
    eval_every: 1_000
    generate_every: 500
    log_every: 50
    log_grad_norm_every: 1_000
    resume: True
    tokenizer_checkpoint: "tokenizer_titok_s128.bin"

model:
    type: "titok"
    vq_model:
        codebook_size: 4096
        token_size: 12
        use_l2_norm: True
        commitment_cost: 0.25
        # vit arch
        vit_enc_model_size: "small"
        vit_dec_model_size: "small"
        vit_enc_patch_size: 16
        vit_dec_patch_size: 16
        num_latent_tokens: 128
        finetune_decoder: True
        # relax assertion
        strict_length_assertion: False
        pretrained_tokenizer_weight: "maskgit-vqgan-imagenet-f16-256.bin"
    
    generator_type: "llamagen"
    generator:
        model_type: "GPT-B"
        model_args:
            multiple_of: 256  # make SwiGLU hidden layer size multiple of large power of 2
            rope_base: 10000
            norm_eps: 1e-5
            initializer_range: 0.02
            
            token_dropout_p: 0.1
            attn_dropout_p: 0.0
            resid_dropout_p: 0.1
            ffn_dropout_p: 0.1
            drop_path_rate: 0.0

            num_classes: 1000
            caption_dim: 2048
            class_dropout_prob: 0.1
            model_type: 'c2i'

            vocab_size: 4096
            cls_token_num: 1
            # 画像1枚あたりのトークン数
            block_size: 128

        hidden_size: 768
        num_hidden_layers: 24
        num_attention_heads: 16
        intermediate_size: 3072
        dropout: 0.1
        attn_drop: 0.1
        num_steps: 8
        class_label_dropout: 0.1
        image_seq_len: ${model.vq_model.num_latent_tokens}
        condition_num_classes: 1000

        # sampling hyper-params on the flight
        randomize_temperature: 1.0
        guidance_scale: 4.5
        guidance_decay: "constant"

losses:
    label_smoothing: 0.1
    loss_weight_unmasked_token: 0.1

dataset:
    params:
        train_shards_path_or_url: /home/user_00005_821839/turing_data/dataset/One-D-Piece/imagenet_gaggle/imagenet-train-{000000..000320}.tar
        eval_shards_path_or_url: /home/user_00005_821839/turing_data/dataset/One-D-Piece/imagenet_gaggle/imagenet-val-{000000..000049}.tar
        num_workers_per_gpu: 12
    preprocessing:
        resize_shorter_edge: 256
        crop_size: 256
        # random crop is not used in llamagen
        random_crop: False
        random_flip: True

optimizer:
    name: adamw 
    params:
        learning_rate: 2e-4
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.05


# In original llamagen, lr_scheduler is not used at all.
lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 0
        end_lr: 1e-4


training:
    gradient_accumulation_steps: 1
    per_gpu_batch_size: 256 # 32 GPU, total batch size 2048
    mixed_precision: "bf16"
    enable_tf32: True
    enable_wandb: True
    use_ema: True
    seed: 42
    max_train_steps: 500_000
    max_grad_norm: 1.0
