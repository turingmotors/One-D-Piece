experiment:
  project: exp001-titok_generation_l32
  name: exp001-titok_l32_llamagen
  output_dir: /home/user_00005_821839/workspace/One-D-Piece/experiments/llamagen_s128_titok_l32
  max_train_examples: 1281167
  save_every: 10000
  eval_every: 1000
  generate_every: 500
  log_every: 50
  log_grad_norm_every: 1000
  resume: true
  tokenizer_checkpoint: /home/user_00005_821839/workspace/diffullama/One-D-Piece/tokenizer_titok_l32.bin
  logging_dir: /home/user_00005_821839/workspace/One-D-Piece-Experiment/experiments/llamagen_s128_titok_l32/logs
model:
  type: titok
  vq_model:
    codebook_size: 4096
    token_size: 12
    use_l2_norm: true
    commitment_cost: 0.25
    is_single_stage: false
    vit_enc_model_size: large
    vit_dec_model_size: large
    vit_enc_patch_size: 16
    vit_dec_patch_size: 16
    num_latent_tokens: 32
    finetune_decoder: true
    strict_length_assertion: false
    pretrained_tokenizer_weight: maskgit-vqgan-imagenet-f16-256.bin
  generator_type: llamagen
  generator:
    model_type: GPT-B
    model_args:
      multiple_of: 256
      rope_base: 10000
      norm_eps: 1.0e-05
      initializer_range: 0.02
      token_dropout_p: 0.1
      attn_dropout_p: 0.0
      resid_dropout_p: 0.1
      ffn_dropout_p: 0.1
      drop_path_rate: 0.0
      num_classes: 1000
      caption_dim: 2048
      class_dropout_prob: 0.1
      model_type: c2i
      vocab_size: 4096
      cls_token_num: 1
      block_size: 32
    hidden_size: 768
    num_hidden_layers: 24
    num_attention_heads: 16
    intermediate_size: 3072
    dropout: 0.1
    attn_drop: 0.1
    num_steps: 8
    class_label_dropout: 0.1
    image_seq_len: ${model.vq_model.num_latent_tokens}
    condition_num_classes: 1000
    randomize_temperature: 1.0
    guidance_scale: 4.5
    guidance_decay: constant
losses:
  label_smoothing: 0.1
  loss_weight_unmasked_token: 0.1
dataset:
  params:
    train_shards_path_or_url: /home/user_00005_821839/turing_data/dataset/One-D-Piece/imagenet_gaggle/imagenet-train-{000000..000320}.tar
    eval_shards_path_or_url: /home/user_00005_821839/turing_data/dataset/One-D-Piece/imagenet_gaggle/imagenet-val-{000000..000049}.tar
    num_workers_per_gpu: 12
  preprocessing:
    resize_shorter_edge: 256
    crop_size: 256
    random_crop: false
    random_flip: true
optimizer:
  name: adamw
  params:
    learning_rate: 0.0002
    beta1: 0.9
    beta2: 0.95
    weight_decay: 0.05
lr_scheduler:
  scheduler: cosine
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 0
    end_lr: 0.0001
training:
  gradient_accumulation_steps: 1
  per_gpu_batch_size: 1024
  mixed_precision: bf16
  enable_tf32: true
  enable_wandb: true
  use_ema: true
  seed: 42
  max_train_steps: 500000
  max_grad_norm: 1.0
config: /home/user_00005_821839/workspace/One-D-Piece-Experiment/configs/exp-miwa/generator/exp001-titok_l32_llamagen.yaml
